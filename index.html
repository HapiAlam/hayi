<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayi Party Room</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0f0c20;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile View Container */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 860px;
            background: linear-gradient(180deg, #1f1147 0%, #120b2b 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        /* Top Bar */
        .top-bar {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            color: #fff;
        }

        .room-meta h2 {
            font-size: 16px;
            font-weight: 700;
        }

        .room-meta span {
            font-size: 11px;
            color: #a78bfa;
        }

        .coins-badge {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid #f59e0b;
            color: #fcd34d;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        /* Voice Mic Grid */
        .seats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 16px;
        }

        .seat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .avatar-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px dashed #8b5cf6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            position: relative;
            transition: all 0.2s;
        }

        .avatar-circle.active {
            border: 2px solid #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
            background: #2e1065;
        }

        .speaking-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #10b981;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #1f1147;
            display: none;
        }

        .avatar-circle.active .speaking-badge {
            display: block;
        }

        .seat-name {
            font-size: 11px;
            color: #d8b4fe;
            text-align: center;
            max-width: 65px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Party Game Box */
        .game-bar {
            margin: 0 16px 10px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .game-bar button {
            background: #f43f5e;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        /* Live Chat Feed */
        .chat-area {
            flex: 1;
            padding: 0 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-bubble {
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            max-width: 85%;
            word-break: break-word;
            align-self: flex-start;
        }

        .chat-user {
            font-weight: bold;
            color: #a78bfa;
            margin-right: 6px;
        }

        .chat-msg {
            color: #f1f5f9;
        }

        .system-gift-msg {
            background: rgba(245, 158, 11, 0.15);
            border-left: 3px solid #f59e0b;
            color: #fde68a;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 6px;
        }

        /* Bottom Controls */
        .bottom-bar {
            padding: 12px 16px;
            background: rgba(15, 12, 32, 0.95);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 8px 14px;
            color: white;
            outline: none;
            font-size: 13px;
        }

        .action-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .action-btn.active {
            background: #10b981;
        }

        /* Gift Modal */
        .gift-sheet {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a103c;
            border-radius: 20px 20px 0 0;
            padding: 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .gift-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            color: white;
            cursor: pointer;
        }

        .gift-card:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .gift-card span {
            display: block;
            font-size: 24px;
        }

        .gift-card p {
            font-size: 11px;
            margin-top: 4px;
            color: #fbbf24;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="top-bar">
        <div class="room-meta">
            <h2>🎉 Party Room #101</h2>
            <span>Online: 24 लोग</span>
        </div>
        <div class="coins-badge" id="coinBalance">🪙 1,000</div>
    </div>

    <!-- 8 Voice Seats Grid -->
    <div class="seats-grid" id="seatsGrid">
        <!-- Seats dynamically generated -->
    </div>

    <!-- Mini Party Game Section -->
    <div class="game-bar">
        <div>
            <span style="font-size:12px; color:#cbd5e1;">🎲 Lucky Dice</span>
            <div id="diceResult" style="font-size:14px; font-weight:bold; color:#fcd34d;">रोल करें और जीतें!</div>
        </div>
        <button onclick="rollLuckyDice()">रोल (Roll)</button>
    </div>

    <!-- Chat Stream -->
    <div class="chat-area" id="chatArea">
        <div class="chat-bubble">
            <span class="chat-user">सिस्टम:</span>
            <span class="chat-msg">रूम में आपका स्वागत है! खाली सीट पर क्लिक करके माइक लें।</span>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-bar">
        <input type="text" id="msgInput" class="input-box" placeholder="चैट करें..." onkeydown="handleEnter(event)">
        <button class="action-btn" id="micBtn" onclick="toggleMic()" title="माइक ऑन/ऑफ">🎙️</button>
        <button class="action-btn" onclick="openGiftSheet()" title="गिफ्ट भेजें">🎁</button>
        <button class="action-btn" onclick="sendMessage()" style="background:#7c3aed;">➤</button>
    </div>

    <!-- Gift Sheet -->
    <div class="gift-sheet" id="giftSheet">
        <div style="display:flex; justify-content:space-between; align-items:center; color:#fff;">
            <strong style="font-size:14px;">गिफ्ट भेजें</strong>
            <span style="cursor:pointer; font-size:18px;" onclick="closeGiftSheet()">✕</span>
        </div>
        <div class="gift-grid">
            <div class="gift-card" onclick="sendGift('🌹 गुलाब', 10)">
                <span>🌹</span>
                <p>10 कॉइन</p>
            </div>
            <div class="gift-card" onclick="sendGift('🚀 रॉकेट', 50)">
                <span>🚀</span>
                <p>50 कॉइन</p>
            </div>
            <div class="gift-card" onclick="sendGift('👑 क्राउन', 100)">
                <span>👑</span>
                <p>100 कॉइन</p>
            </div>
            <div class="gift-card" onclick="sendGift('🏎️ सुपर कार', 200)">
                <span>🏎️</span>
                <p>200 कॉइन</p>
            </div>
        </div>
    </div>
</div>

<script>
    let userCoins = 1000;
    let isMicOn = false;
    let mySeatIndex = null;

    // 8 Voice Seats Setup
    const seatsData = [
        { name: "होस्ट", icon: "👑", taken: true },
        { name: "सीट 2", icon: "+", taken: false },
        { name: "सीट 3", icon: "+", taken: false },
        { name: "सीट 4", icon: "+", taken: false },
        { name: "सीट 5", icon: "+", taken: false },
        { name: "सीट 6", icon: "+", taken: false },
        { name: "सीट 7", icon: "+", taken: false },
        { name: "सीट 8", icon: "+", taken: false }
    ];

    function renderSeats() {
        const grid = document.getElementById("seatsGrid");
        grid.innerHTML = "";
        seatsData.forEach((seat, index) => {
            const div = document.createElement("div");
            div.className = "seat-item";
            div.onclick = () => takeSeat(index);
            div.innerHTML = `
                <div class="avatar-circle ${seat.taken ? 'active' : ''}">
                    ${seat.icon}
                    <div class="speaking-badge"></div>
                </div>
                <div class="seat-name">${seat.name}</div>
            `;
            grid.appendChild(div);
        });
    }

    function takeSeat(index) {
        if (index === 0) return; // Host seat locked
        
        if (mySeatIndex === index) {
            // Leave seat
            seatsData[index] = { name: "खाली", icon: "+", taken: false };
            mySeatIndex = null;
            addChatMessage("सिस्टम", "आप सीट से नीचे उतर गए।");
        } else {
            // Take seat
            if (mySeatIndex !== null) {
                seatsData[mySeatIndex] = { name: "खाली", icon: "+", taken: false };
            }
            seatsData[index] = { name: "आप", icon: "😎", taken: true };
            mySeatIndex = index;
            addChatMessage("सिस्टम", `आप सीट नंबर ${index + 1} पर बैठ गए!`);
        }
        renderSeats();
    }

    function toggleMic() {
        const micBtn = document.getElementById("micBtn");
        if (mySeatIndex === null) {
            alert("माइक खोलने के लिए पहले किसी खाली सीट पर क्लिक करें!");
            return;
        }
        isMicOn = !isMicOn;
        if (isMicOn) {
            micBtn.classList.add("active");
            micBtn.innerText = "🔊";
            addChatMessage("माइक", "आपका माइक अब चालू (LIVE) है।");
        } else {
            micBtn.classList.remove("active");
            micBtn.innerText = "🎙️";
            addChatMessage("माइक", "माइक म्यूट कर दिया गया।");
        }
    }

    function rollLuckyDice() {
        const num = Math.floor(Math.random() * 6) + 1;
        document.getElementById("diceResult").innerText = `आपका नंबर: ${num} 🎲`;
        addChatMessage("गेम", `आपने डाइस घुमाया और ${num} आया!`);
    }

    function sendMessage() {
        const input = document.getElementById("msgInput");
        const msg = input.value.trim();
        if (msg === "") return;
        addChatMessage("आप", msg);
        input.value = "";
    }

    function handleEnter(e) {
        if (e.key === "Enter") sendMessage();
    }

    function addChatMessage(user, msg, isGift = false) {
        const chatArea = document.getElementById("chatArea");
        const div = document.createElement("div");
        if (isGift) {
            div.className = "system-gift-msg";
            div.innerText = `${user} ने ${msg} भेजा!`;
        } else {
            div.className = "chat-bubble";
            div.innerHTML = `<span class="chat-user">${user}:</span><span class="chat-msg">${msg}</span>`;
        }
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function openGiftSheet() {
        document.getElementById("giftSheet").style.display = "block";
    }

    function closeGiftSheet() {
        document.getElementById("giftSheet").style.display = "none";
    }

    function sendGift(giftName, cost) {
        if (userCoins < cost) {
            alert("पर्याप्त कॉइन नहीं हैं!");
            return;
        }
        userCoins -= cost;
        document.getElementById("coinBalance").innerText = `🪙 ${userCoins.toLocaleString()}`;
        addChatMessage("आप", giftName, true);
        closeGiftSheet();
    }

    // Initial load
    renderSeats();
</script>

</body>
</html>
